<style>
:root {
  --paper: #fff8f0; --ink: #1a1410; --muted: #6b6158; --rule: #eadfd2; --soft: #f6ecdf; --card: #ffffff;
  --flame: #ff5b2e; --citrus: #ffc21a; --lagoon: #12b5a6; --bubble: #ff6fb5;
  --flame-t: #ffe3d8; --citrus-t: #fff1c6; --lagoon-t: #cff1ec; --bubble-t: #ffe0ef; --bad: #c2361f;
  --shadow: #1a1410;
  --display: "Bricolage Grotesque", "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif;
  --body: "Figtree", "Helvetica Neue", Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --paper: #15100d; --ink: #f6ecdf; --muted: #bcae9f; --rule: #3a2e25; --soft: #2d231c; --card: #211913;
  --flame-t: #4a2417; --citrus-t: #43360f; --lagoon-t: #103a35; --bubble-t: #45203a; --bad: #ff8e70; --shadow: #8a7a6b; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); min-height: 100vh;
  padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--lagoon); outline-offset: 3px; }

/* Verrou */
.lock { max-width: 360px; margin: 6vh auto 0; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.lock svg { width: 64px; height: 64px; }
.lock h1 { font: 800 30px/1.1 var(--display); margin: 0; }
.lock p { margin: 0; color: var(--muted); }
.pass { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.field { position: relative; }
.field input { width: 100%; font: 500 17px var(--body); color: var(--ink); background: var(--card); border: 2px solid var(--ink); border-radius: 16px; padding: 14px 96px 14px 16px; box-shadow: 3px 3px 0 var(--shadow); }
.field .eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: 0; font: 600 14px var(--body); color: var(--muted); cursor: pointer; padding: 8px 10px; }
.field.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-8px) } 40%,80% { transform: translateX(8px) } }
@media (prefers-reduced-motion: reduce) { .field.shake { animation: none; } }
.go { border: 2px solid var(--ink); background: var(--citrus); color: #1a1410; border-radius: 16px; padding: 13px 16px; font: 700 17px var(--display); cursor: pointer; box-shadow: 3px 3px 0 var(--shadow); }
.go:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--shadow); }
.go:disabled { opacity: .6; cursor: wait; }
.msg { min-height: 1.5em; font: 500 14px var(--mono); color: var(--bad); }
.msg.wait { color: var(--muted); }

/* Coffre ouvert */
.vault { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }
.top { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.brand { display: flex; gap: 14px; align-items: center; }
.brand svg { width: 48px; height: 48px; flex: none; }
.brand h1 { font: 800 clamp(26px, 4vw, 36px)/1.05 var(--display); margin: 0; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; }
.search { font: 500 15px var(--body); color: var(--ink); background: var(--card); border: 2px solid var(--ink); border-radius: 999px; padding: 10px 16px; width: min(280px, 100%); }
.out { border: 2px solid var(--ink); background: var(--citrus); color: #1a1410; border-radius: 999px; padding: 10px 16px; font-weight: 700; cursor: pointer; box-shadow: 3px 3px 0 var(--shadow); }
section h2 { font: 800 22px var(--display); margin: 0; }
section .gd { margin: 2px 0 14px; color: var(--muted); font: 500 13px var(--mono); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--ink); background: var(--card); border: 2px solid var(--ink); border-radius: 20px; padding: 16px 16px 14px; box-shadow: 4px 4px 0 var(--shadow); transition: transform .12s, box-shadow .12s; min-width: 0; }
.card:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--shadow); }
.card:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--shadow); }
.card b { font: 700 17px/1.2 var(--display); }
.card span.s { font-size: 14px; color: var(--muted); }
.card .u { margin-top: auto; padding-top: 8px; font: 500 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.tag { align-self: flex-start; font: 600 11.5px var(--mono); border: 1.5px solid var(--ink); border-radius: 6px; padding: 1px 7px; color: var(--ink); }
.tag.public { background: var(--lagoon-t); }
.tag.login { background: var(--citrus-t); }
.tag.claude { background: var(--bubble-t); }
.note { background: var(--soft); border-radius: 18px; padding: 14px 16px; font-size: 14px; color: var(--muted); max-width: 70ch; }
.empty { color: var(--muted); }
</style>
</head>

<main class="lock" id="lock">
  <svg aria-hidden="true"><use href="#logo"/></svg>
  <h1>Admin secret</h1>
  <p>Entre ta phrase de passe.</p>
  <form class="pass" id="pass" autocomplete="on">
    <input type="text" name="username" value="mypush-admin" autocomplete="username" hidden>
    <label for="code" style="position:absolute;left:-9999px">Phrase de passe</label>
    <div class="field" id="field">
      <input id="code" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Phrase de passe" required>
      <button type="button" class="eye" id="eye" aria-pressed="false">Afficher</button>
    </div>
    <button type="submit" class="go" id="go">Ouvrir</button>
  </form>
  <div class="msg" id="msg" role="status"></div>
</main>

<div class="vault" id="vault" hidden>
  <div class="top">
    <div class="brand">
      <svg aria-hidden="true"><use href="#logo"/></svg>
      <div><h1>Tous les liens MyPush</h1><p id="total"></p></div>
    </div>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Chercher : caisse, Supabase…" aria-label="Chercher un lien">
      <button class="out" id="out">Verrouiller</button>
    </div>
  </div>
  <div id="groups"></div>
  <p class="note">Non inclus : les liens de validation (/validation/…) et les liens suivis (/l/…), car chacun est propre à une campagne ou à une carte. Tu les trouves dans la page de chaque campagne.</p>
</div>

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let busy = false;

async function open(c) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(c), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(VAULT.salt), iterations: VAULT.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(VAULT.iv)}, key, b64(VAULT.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

$('pass').addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  const code = $('code').value;
  if (!code) { $('msg').className = 'msg'; $('msg').textContent = 'Tape ta phrase de passe.'; $('code').focus(); return; }
  busy = true; $('go').disabled = true;
  $('msg').className = 'msg wait'; $('msg').textContent = 'Ouverture…';
  try {
    const data = await open(code);
    try { sessionStorage.setItem('mp-coffre', code); } catch (err) {}
    $('msg').textContent = '';
    show(data);
  } catch (err) {
    $('msg').className = 'msg'; $('msg').textContent = 'Phrase de passe incorrecte. Attention aux majuscules et aux espaces.';
    $('field').classList.remove('shake'); void $('field').offsetWidth; $('field').classList.add('shake');
    $('code').select();
  }
  busy = false; $('go').disabled = false;
});
$('code').addEventListener('input', () => { if (!busy) $('msg').textContent = ''; });
$('eye').addEventListener('click', () => {
  const shown = $('code').type === 'text';
  $('code').type = shown ? 'password' : 'text';
  $('eye').textContent = shown ? 'Afficher' : 'Masquer';
  $('eye').setAttribute('aria-pressed', String(!shown));
  $('code').focus();
});

function show(groups) {
  $('lock').hidden = true; $('vault').hidden = false;
  const root = $('groups'); root.innerHTML = '';
  let n = 0;
  const labels = {public: 'Ouvert à tous', login: 'Connexion requise', claude: 'claude.ai'};
  groups.forEach(g => {
    const sec = document.createElement('section');
    const h = document.createElement('h2'); h.textContent = g.g;
    const d = document.createElement('p'); d.className = 'gd'; d.textContent = g.d;
    const grid = document.createElement('div'); grid.className = 'cards';
    g.items.forEach(it => {
      n++;
      const a = document.createElement('a');
      a.className = 'card'; a.href = it.u; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.dataset.search = (it.t + ' ' + it.s + ' ' + it.u + ' ' + g.g).toLowerCase();
      const tag = document.createElement('span'); tag.className = 'tag ' + it.a; tag.textContent = labels[it.a];
      const t = document.createElement('b'); t.textContent = it.t;
      const s = document.createElement('span'); s.className = 's'; s.textContent = it.s;
      const u = document.createElement('span'); u.className = 'u'; u.textContent = it.u.replace(/^https:\/\//, '');
      a.append(tag, t, s, u); grid.appendChild(a);
    });
    sec.append(h, d, grid); root.appendChild(sec);
  });
  $('total').textContent = `${n} liens, ${groups.length} familles`;
  $('q').focus();
}

$('q').addEventListener('input', () => {
  const q = $('q').value.trim().toLowerCase();
  document.querySelectorAll('#groups section').forEach(sec => {
    let any = false;
    sec.querySelectorAll('.card').forEach(c => { const m = !q || c.dataset.search.includes(q); c.hidden = !m; any = any || m; });
    sec.hidden = !any;
  });
});

$('out').addEventListener('click', () => {
  try { sessionStorage.removeItem('mp-coffre'); } catch (e) {}
  $('groups').innerHTML = ''; $('vault').hidden = true; $('lock').hidden = false;
  $('code').value = ''; $('msg').textContent = ''; $('q').value = ''; $('code').focus();
});

(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem('mp-coffre'); } catch (e) {}
  if (saved) { try { show(await open(saved)); } catch (e) {} }
})();
</script>
