<style>
/* Coffre MyPush : verrou (phrase de passe), puis sommaire des sections (barre latérale ou pastilles),
   recherche fixe, parcours client en frise, le reste en cartes compactes avec favoris. Palette MyPush. */
:root {
  --paper: #fff8f0; --ink: #1a1410; --muted: #6b6158; --rule: #eadfd2; --soft: #f6ecdf; --card: #ffffff;
  --flame: #ff5b2e; --citrus: #ffc21a; --lagoon: #12b5a6; --bubble: #ff6fb5;
  --flame-t: #ffe3d8; --citrus-t: #fff1c6; --lagoon-t: #cff1ec; --bubble-t: #ffe0ef; --bad: #c2361f;
  --shadow: #1a1410;
  --display: "Bricolage Grotesque", "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif;
  --body: "Figtree", "Helvetica Neue", Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --paper: #15100d; --ink: #f6ecdf; --muted: #bcae9f; --rule: #3a2e25; --soft: #2d231c; --card: #211913;
  --flame-t: #4a2417; --citrus-t: #43360f; --lagoon-t: #103a35; --bubble-t: #45203a; --bad: #ff8e70; --shadow: #8a7a6b; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-block: 0 56px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--lagoon); outline-offset: 2px; }

/* Verrou */
.lock { max-width: 360px; margin: calc(6vh + env(safe-area-inset-top)) auto 0; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.lock svg { width: 64px; height: 64px; }
.lock h1 { font: 800 30px/1.1 var(--display); margin: 0; }
.lock p { margin: 0; color: var(--muted); }
.pass { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.field { position: relative; }
.field input { width: 100%; font: 500 17px var(--body); color: var(--ink); background: var(--card); border: 2px solid var(--ink); border-radius: 16px; padding: 14px 96px 14px 16px; box-shadow: 3px 3px 0 var(--shadow); }
.field .eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: 0; font: 600 14px var(--body); color: var(--muted); cursor: pointer; padding: 8px 10px; }
.field.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-8px) } 40%,80% { transform: translateX(8px) } }
@media (prefers-reduced-motion: reduce) { .field.shake { animation: none; } }
.open { border: 2px solid var(--ink); background: var(--citrus); color: #1a1410; border-radius: 16px; padding: 13px 16px; font: 700 17px var(--display); cursor: pointer; box-shadow: 3px 3px 0 var(--shadow); }
.open:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--shadow); }
.open:disabled { opacity: .6; cursor: wait; }
.msg { min-height: 1.5em; font: 500 14px var(--mono); color: var(--bad); }
.msg.wait { color: var(--muted); }

/* En-tête fixe */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 14px 12px; border-bottom: 1.5px solid var(--rule); }
.bar-in { max-width: 1240px; margin: 0 auto; display: flex; gap: 14px; align-items: center; }
.brand { display: flex; align-items: center; gap: 10px; flex: none; text-decoration: none; }
.brand svg { width: 36px; height: 36px; }
.brand b { font: 800 20px var(--display); }
.search { position: relative; flex: 1; min-width: 0; }
.search input { width: 100%; font: 500 15px var(--body); color: var(--ink); background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 44px 10px 14px; }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 500 12px var(--mono); color: var(--muted); border: 1.5px solid var(--rule); border-radius: 6px; padding: 1px 6px; background: var(--paper); }
.lockbtn { flex: none; border: 2px solid var(--ink); background: var(--citrus); color: #1a1410; border-radius: 12px; padding: 9px 13px; font: 700 14px var(--body); cursor: pointer; box-shadow: 2px 2px 0 var(--shadow); }
@media (max-width: 560px) { .brand b, .search kbd { display: none; } }
.pills { display: none; gap: 8px; overflow-x: auto; padding-top: 10px; scrollbar-width: none; max-width: 1240px; margin: 0 auto; }
.pills a { flex: none; text-decoration: none; font: 600 13.5px var(--body); border: 1.5px solid var(--ink); border-radius: 999px; padding: 5px 12px; background: var(--card); }
.pills a.on { background: var(--ink); color: var(--paper); }
@media (max-width: 900px) { .pills { display: flex; } }

/* Mise en page */
.layout { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; align-items: start; padding-top: 22px; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { display: none; } }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); display: flex; flex-direction: column; gap: 2px; }
.side .lbl { font: 500 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 10px 6px; }
.side a { display: flex; justify-content: space-between; gap: 8px; text-decoration: none; padding: 8px 10px; border-radius: 10px; font-weight: 600; }
.side a:hover { background: var(--soft); }
.side a.on { background: var(--ink); color: var(--paper); }
.side a span { font: 500 12px var(--mono); opacity: .7; font-variant-numeric: tabular-nums; }
main { display: flex; flex-direction: column; gap: 40px; min-width: 0; }
section { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 110px); display: flex; flex-direction: column; gap: 14px; }
.head h2 { font: 800 24px/1.1 var(--display); margin: 0; text-wrap: balance; }
.head p { margin: 3px 0 0; color: var(--muted); }
.divider { display: flex; align-items: center; gap: 12px; font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.divider::before, .divider::after { content: ""; flex: 1; height: 1.5px; background: var(--rule); }

/* Frise du parcours client */
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1100px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .flow { grid-template-columns: minmax(0, 1fr); } }
.stepbox { background: var(--card); border: 2px solid var(--ink); border-radius: 20px; box-shadow: 4px 4px 0 var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.stepbox.main { background: var(--flame-t); }
.stepno { display: flex; align-items: center; gap: 8px; font: 500 12px var(--mono); color: var(--muted); }
.stepno b { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--paper); font: 500 12px var(--mono); }
.stepbox h3 { font: 800 18px/1.15 var(--display); margin: 0; }
.stepbox p { margin: 0; color: var(--muted); font-size: 14px; }
.gos { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
.go { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-decoration: none; font: 700 14.5px var(--body); border: 2px solid var(--ink); border-radius: 12px; padding: 9px 12px; background: var(--card); box-shadow: 2px 2px 0 var(--shadow); }
.go.primary { background: var(--flame); color: #1a1410; }
.go:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--shadow); }
.go small { font: 500 11.5px var(--mono); opacity: .75; }

/* Cartes */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.sub { font: 700 14px var(--display); margin: 6px 0 -4px; color: var(--muted); }
.card { position: relative; background: var(--card); border: 2px solid var(--ink); border-radius: 16px; box-shadow: 3px 3px 0 var(--shadow); transition: transform .1s, box-shadow .1s; min-width: 0; }
.card:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--shadow); }
.card a { display: flex; flex-direction: column; gap: 3px; padding: 12px 44px 12px 14px; text-decoration: none; height: 100%; }
.card b { font: 700 15.5px/1.25 var(--display); }
.card .s { color: var(--muted); font-size: 13.5px; }
.card .u { font: 500 11.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; margin-top: 4px; }
.pin { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 8px; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 17px; line-height: 1; }
.pin:hover { background: var(--soft); }
.pin[aria-pressed="true"] { color: var(--flame); }
.tag { display: inline-block; font: 600 11px var(--mono); border: 1.5px solid var(--ink); border-radius: 6px; padding: 0 6px; margin-bottom: 4px; align-self: flex-start; }
.t-public { background: var(--lagoon-t); }
.t-login { background: var(--citrus-t); }
.t-claude { background: var(--bubble-t); }
.empty { color: var(--muted); background: var(--soft); border-radius: 14px; padding: 14px 16px; margin: 0; }
.note { background: var(--soft); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; color: var(--muted); margin: 0; max-width: 72ch; }
.hide { display: none !important; }
</style>
</head>

<main class="lock" id="lock">
  <svg aria-hidden="true"><use href="#logo"/></svg>
  <h1>Coffre MyPush</h1>
  <p>Entre ta phrase de passe.</p>
  <form class="pass" id="pass" autocomplete="on">
    <input type="text" name="username" value="mypush-admin" autocomplete="username" hidden>
    <label for="code" style="position:absolute;left:-9999px">Phrase de passe</label>
    <div class="field" id="field">
      <input id="code" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Phrase de passe" required>
      <button type="button" class="eye" id="eye" aria-pressed="false">Afficher</button>
    </div>
    <button type="submit" class="open" id="go">Ouvrir</button>
  </form>
  <div class="msg" id="msg" role="status"></div>
</main>

<div id="vault" hidden>
  <header class="bar">
    <div class="bar-in">
      <a class="brand" href="#favoris" aria-label="Haut de page"><svg aria-hidden="true"><use href="#logo"/></svg><b>Coffre MyPush</b></a>
      <div class="search">
        <label for="q" style="position:absolute;left:-9999px">Chercher un lien</label>
        <input id="q" type="search" placeholder="Chercher : inscription, caisse, Supabase…" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <button class="lockbtn" id="out" type="button">Verrouiller</button>
    </div>
    <nav class="pills" id="pills" aria-label="Sections"></nav>
  </header>
  <div class="layout">
    <nav class="side" id="side" aria-label="Sections"></nav>
    <main id="main"></main>
  </div>
</div>

async function open(c) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(c), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(VAULT.salt), iterations: VAULT.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(VAULT.iv)}, key, b64(VAULT.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

$('pass').addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  const code = $('code').value;
  if (!code) { $('msg').className = 'msg'; $('msg').textContent = 'Tape ta phrase de passe.'; $('code').focus(); return; }
  busy = true; $('go').disabled = true;
  $('msg').className = 'msg wait'; $('msg').textContent = 'Ouverture…';
  try {
    const data = await open(code);
    try { sessionStorage.setItem('mp-coffre', code); } catch (err) {}
    $('msg').textContent = '';
    show(data);
  } catch (err) {
    $('msg').className = 'msg'; $('msg').textContent = 'Phrase de passe incorrecte. Attention aux majuscules et aux espaces.';
    $('field').classList.remove('shake'); void $('field').offsetWidth; $('field').classList.add('shake');
    $('code').select();
  }
  busy = false; $('go').disabled = false;
});
$('code').addEventListener('input', () => { if (!busy) $('msg').textContent = ''; });
$('eye').addEventListener('click', () => {
  const shown = $('code').type === 'text';
  $('code').type = shown ? 'password' : 'text';
  $('eye').textContent = shown ? 'Afficher' : 'Masquer';
  $('eye').setAttribute('aria-pressed', String(!shown));
  $('code').focus();
});

function card(it) {
  const on = pins.includes(it.u);
  return `<div class="card" data-q="${esc((it.t + ' ' + it.s + ' ' + it.u + ' ' + (it.sub || '')).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener noreferrer"><span class="tag t-${esc(it.a)}">${TAG[it.a] || ''}</span><b>${esc(it.t)}</b><span class="s">${esc(it.s)}</span><span class="u">${esc(host(it.u))}</span></a>
    <button class="pin" type="button" data-u="${esc(it.u)}" aria-pressed="${on}" aria-label="${on ? 'Retirer des favoris' : 'Ajouter aux favoris'} : ${esc(it.t)}">${on ? '★' : '☆'}</button>
  </div>`;
}

function render() {
  const known = new Set(SECTIONS.map(s => s.id));
  const bySec = {};
  for (const it of ITEMS) { const s = known.has(it.sec) ? it.sec : 'autres'; (bySec[s] = bySec[s] || []).push(it); }
  const nav = [];
  const pinned = ITEMS.filter((it, i) => pins.includes(it.u) && ITEMS.findIndex(x => x.u === it.u) === i);
  let html = `<section id="favoris"><div class="head"><h2>Favoris</h2><p>Touche l'étoile d'une carte pour la garder ici, en haut.</p></div>` +
    (pinned.length ? `<div class="cards">${pinned.map(card).join('')}</div>` : `<p class="empty">Aucun favori pour l'instant.</p>`) + `</section>`;
  nav.push({id: 'favoris', t: 'Favoris', n: pinned.length});
  for (const s of SECTIONS) {
    if (s.divider) { html += `<div class="divider">${s.divider}</div>`; nav.push({lbl: s.divider}); continue; }
    const items = bySec[s.id] || [];
    if (!items.length) continue;
    html += `<section id="${s.id}"><div class="head"><h2>${s.t}</h2><p>${s.d}</p></div>`;
    if (s.flow) {
      const steps = {};
      for (const it of items) (steps[it.etape || 4] = steps[it.etape || 4] || []).push(it);
      html += `<div class="flow">` + Object.keys(steps).sort((a, b) => a - b).map(n => {
        const st = STEPS[n] || {t: 'Étape ' + n, s: ''};
        return `<div class="stepbox${st.main ? ' main' : ''}" data-q="${esc((st.t + ' ' + st.s + ' ' + steps[n].map(l => l.t + ' ' + l.s + ' ' + l.u).join(' ')).toLowerCase())}">
          <span class="stepno"><b>${n}</b>Étape ${n}</span><h3>${st.t}</h3><p>${st.s}</p>
          <div class="gos">${steps[n].map(l => `<a class="go${st.main ? ' primary' : ''}" href="${esc(l.u)}" target="_blank" rel="noopener noreferrer"><span>${esc(l.t)}</span><small>↗</small></a>`).join('')}</div></div>`;
      }).join('') + `</div>`;
    } else {
      let last = null, block = '';
      for (const it of items) {
        if (it.sub && it.sub !== last) { if (block) html += `<div class="cards">${block}</div>`; block = ''; html += `<h3 class="sub">${esc(it.sub)}</h3>`; last = it.sub; }
        block += card(it);
      }
      html += `<div class="cards">${block}</div>`;
    }
    html += `</section>`;
    nav.push({id: s.id, t: s.t, n: items.length});
  }
  html += `<p class="note">Non inclus : les liens de validation (/validation/…) et les liens suivis (/l/…), propres à chaque campagne ou carte. Tu les trouves dans la page de chaque campagne.</p>`;
  $('main').innerHTML = html;
  $('side').innerHTML = nav.map(n => n.lbl ? `<span class="lbl">${n.lbl}</span>` : `<a href="#${n.id}" data-id="${n.id}">${n.t}<span>${n.n}</span></a>`).join('');
  $('pills').innerHTML = nav.filter(n => !n.lbl).map(n => `<a href="#${n.id}" data-id="${n.id}">${n.t}</a>`).join('');
  filter(); spy();
}

function show(groups) {
  ITEMS = groups.flatMap(g => g.items);
  $('lock').hidden = true; $('vault').hidden = false;
  render();
  if (window.innerWidth > 900) $('q').focus();
}

document.addEventListener('click', e => {
  const b = e.target.closest('.pin'); if (!b) return;
  const u = b.dataset.u;
  pins = pins.includes(u) ? pins.filter(x => x !== u) : [...pins, u];
  savePins(); render();
});

function filter() {
  const q = $('q').value.trim().toLowerCase();
  document.querySelectorAll('#main section').forEach(sec => {
    let any = false;
    sec.querySelectorAll('[data-q]').forEach(el => { const m = !q || el.dataset.q.includes(q); el.classList.toggle('hide', !m); any = any || m; });
    sec.querySelectorAll('.sub').forEach(h => {
      const n = h.nextElementSibling;
      h.classList.toggle('hide', !(n && [...n.querySelectorAll('[data-q]')].some(c => !c.classList.contains('hide'))));
    });
    sec.classList.toggle('hide', !!q && (!any || sec.id === 'favoris'));
  });
  document.querySelectorAll('.divider, .note').forEach(d => d.classList.toggle('hide', !!q));
}
$('q').addEventListener('input', filter);
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const a = document.querySelector('#main [data-q]:not(.hide) a'); if (a) a.click(); }
  if (e.key === 'Escape') { $('q').value = ''; filter(); $('q').blur(); }
});
document.addEventListener('keydown', e => {
  if ($('vault').hidden) return;
  if ((e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); $('q').select(); }
});

function spy() {
  if ($('vault').hidden) return;
  const secs = [...document.querySelectorAll('#main section:not(.hide)')];
  let cur = secs[0] && secs[0].id;
  for (const s of secs) if (s.getBoundingClientRect().top - 140 <= 0) cur = s.id;
  document.querySelectorAll('#side a, #pills a').forEach(a => a.classList.toggle('on', a.dataset.id === cur));
  const p = document.querySelector('#pills a.on');
  if (p && window.innerWidth <= 900) p.scrollIntoView({block: 'nearest', inline: 'nearest'});
}
window.addEventListener('scroll', () => requestAnimationFrame(spy), {passive: true});

$('out').addEventListener('click', () => {
  try { sessionStorage.removeItem('mp-coffre'); } catch (e) {}
  ITEMS = []; $('main').innerHTML = ''; $('vault').hidden = true; $('lock').hidden = false;
  $('code').value = ''; $('msg').textContent = ''; $('q').value = ''; $('code').focus();
  window.scrollTo(0, 0);
});

(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem('mp-coffre'); } catch (e) {}
  if (saved) { try { show(await open(saved)); } catch (e) {} }
})();
</script>
</body>
</html>
